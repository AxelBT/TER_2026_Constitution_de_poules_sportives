<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récapitulatif des poules</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="recapitulatif.css">
</head>
<body>

<!-- TOAST -->
<div class="toast-container" id="toast-container"></div>

<!-- TOPBAR -->
<header class="topbar">
    <div class="topbar-inner">
        <span class="topbar-brand">Championnat</span>
        <nav class="topbar-stepper" id="stepper" aria-label="Étapes"></nav>
    </div>
</header>

<!-- DASHBOARD -->
<div class="dashboard">

    <!-- SIDEBAR -->
    <!-- SIDEBAR -->
<aside class="sidebar">

    <div class="panel">
        <div class="panel-header">
            <span class="panel-title">Exporter les poules</span>
        </div>
        <div class="panel-body">

            <!-- Export -->
            <div class="export-section">
                <button class="btn-generate" id="btn-export-excel">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Exporter en Excel
                </button>
                <button class="btn-generate btn-generate--alt" id="btn-export-csv">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="8" y1="13" x2="16" y2="13"/>
                        <line x1="8" y1="17" x2="16" y2="17"/>
                    </svg>
                    Exporter en CSV
                </button>
            </div>

        </div>
    </div>

    <!-- Navigation -->
    <div class="nav-row">
        <button class="btn-nav-prev" id="btn-prev">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
            Retour
        </button>
    </div>

</aside>

    <!-- MAIN -->
    <main class="main-area">

        <!-- Onglets niveaux -->
        <div class="tabs-bar" id="tabs-bar"></div>

        <!-- Contenu du niveau affiché -->
        <div id="recap-content"></div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module" src="recapitulatif.js"></script>
</body>
</html>
