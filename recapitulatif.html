<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récapitulatif des poules</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="recapitulatif.css">
</head>
<body>

<!-- TOAST -->
<div class="toast-container" id="toast-container"></div>

<!-- TOPBAR -->
<header class="topbar">
    <div class="topbar-inner">
        <span class="topbar-brand"></span>
        <nav class="topbar-stepper" id="stepper" aria-label="Étapes"></nav>
    </div>
</header>

<!-- DASHBOARD -->
<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Exporter les poules</span>
            </div>
            <div class="panel-body">

                <div class="export-section">
                    <button class="btn-generate" id="btn-export-excel">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                            <polyline points="7 10 12 15 17 10"/>
                            <line x1="12" y1="15" x2="12" y2="3"/>
                        </svg>
                        Exporter en Excel
                    </button>
                    <button class="btn-generate btn-generate--alt" id="btn-export-csv">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                            <polyline points="14 2 14 8 20 8"/>
                            <line x1="8" y1="13" x2="16" y2="13"/>
                            <line x1="8" y1="17" x2="16" y2="17"/>
                        </svg>
                        Exporter en CSV
                    </button>
                </div>

            </div>
        </div>

        <!-- Navigation -->
        <div class="nav-row">
            <button class="btn-nav-prev" id="btn-prev">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                Retour
            </button>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main-area">
        <div class="tabs-bar" id="tabs-bar"></div>
        <div id="recap-content"></div>
    </main>
</div>

<!-- ── Bouton flottant : numérotation (bas droite) ── -->
<button type="button" class="btn-floating btn-floating--bottom" id="btn-numerotation">
  <svg viewBox="2 4 20 16" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="10" y1="6" x2="21" y2="6"/>
    <line x1="10" y1="12" x2="21" y2="12"/>
    <line x1="10" y1="18" x2="21" y2="18"/>
    <path d="M4 6h1v4"/>
    <path d="M4 10h2"/>
    <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/>
  </svg>
  <span>Numérotation des équipes</span>
</button>

<!-- ── Modale d'avertissement : export requis avant numérotation ── -->
<div class="modal-overlay" id="modal-numerotation" style="display:none;">
  <div class="modal">
    <div class="modal-icon modal-icon--warn">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/>
        <line x1="12" y1="9" x2="12" y2="13"/>
        <line x1="12" y1="17" x2="12.01" y2="17"/>
      </svg>
    </div>
    <h3 class="modal-title">Avant de continuer</h3>
    <p class="modal-message">
      Assurez-vous d'avoir <strong>exporté les poules en CSV</strong> avant de passer à la numérotation.<br/>
      Les données saisies sur cette page <strong>ne seront pas conservées</strong> après navigation.
    </p>
    <div class="modal-actions">
      <button class="modal-btn modal-btn--cancel" id="modal-num-annuler">Annuler</button>
      <button class="modal-btn modal-btn--confirm" id="modal-num-confirmer">J'ai exporté, continuer</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module" src="recapitulatif.js"></script>

<script>
  // Modale de confirmation avant numérotation
  (function () {
    const modal = document.getElementById("modal-numerotation");
    const btnOuvrir = document.getElementById("btn-numerotation");
    const btnAnnuler = document.getElementById("modal-num-annuler");
    const btnConfirmer = document.getElementById("modal-num-confirmer");

    btnOuvrir.addEventListener("click", () => {
      modal.style.display = "flex";
    });
    btnAnnuler.addEventListener("click", () => {
      modal.style.display = "none";
    });
    btnConfirmer.addEventListener("click", () => {
      window.location.href = "numerotation.html";
    });
    modal.addEventListener("click", (e) => {
      if (e.target === modal) modal.style.display = "none";
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && modal.style.display === "flex") {
        modal.style.display = "none";
      }
    });
  })();
</script>

</body>
</html>
