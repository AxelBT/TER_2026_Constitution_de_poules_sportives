<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Récapitulatif des poules</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="recapitulatif.css">
</head>
<body>

<!-- TOAST -->
<div class="toast-container" id="toast-container"></div>

<!-- TOPBAR -->
<header class="topbar">
    <div class="topbar-inner">
        <span class="topbar-brand">Championnat</span>
        <nav class="topbar-stepper" id="stepper" aria-label="Étapes"></nav>
    </div>
</header>

<!-- DASHBOARD -->
<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Récapitulatif</span>
                <span class="badge" id="badge-recap">0 niveau(x)</span>
            </div>
            <div class="panel-body">
                <p class="recap-intro">Toutes les poules générées pour ce championnat.</p>

                <!-- Stats globales -->
                <div class="stats-grid" id="stats-globales"></div>


                <!-- Bouton export Excel -->
                <button class="btn-generate" id="btn-export" style="margin-top: var(--space-md)">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Exporter en Excel
                </button>
            </div>
        </div>

        <!-- Navigation -->
        <div class="nav-row">
            <button class="btn-nav-prev" id="btn-prev">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                Retour
            </button>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main-area">

        <!-- Onglets niveaux -->
        <div class="tabs-bar" id="tabs-bar"></div>

        <!-- Contenu du niveau affiché -->
        <div id="recap-content"></div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module" src="recapitulatif.js"></script>
</body>
</html>
