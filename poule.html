<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuration du Championnat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="card">
            <header class="card-header">
                <h1>Initialisation du Championnat</h1>
                <p>Importez vos clubs et définissez les paramètres de base.</p>
            </header>

            <form id="form-config">
                
                <div class="form-group">
                    <label for="nom_championnat">Nom du Championnat</label>
                    <input type="text" id="nom_championnat" name="nom_championnat" required 
                        placeholder="Ex: Ligue Régionale 2026">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="nb_niveaux">Nombre de niveaux</label>
                        <input type="number" id="nb_niveaux" name="nb_niveaux" min="1" max="5" value="1" required>
                    </div>

                    <div class="form-group">
                        <label>Type de Championnat</label>
                        <div class="radio-group">
                            <label class="radio-label">
                                <input type="radio" name="genre" value="masculin" checked>
                                <span>Masculin</span>
                            </label>
                            <label class="radio-label">
                                <input type="radio" name="genre" value="feminin">
                                <span>Féminin</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Liste des clubs (Format CSV)</label>
                    <div class="drop-zone" id="drop-zone">
                        <input type="file" id="file_csv" name="file_csv" accept=".csv" required class="file-input">
                        <div class="drop-zone-content">
                            <span class="icon">📁</span>
                            <p id="file-label">Glissez votre fichier ici ou <strong>parcourez</strong></p>
                            <p class="file-limit">Format .csv uniquement</p>
                        </div>
                    </div>
                </div>

                <button type="submit" class="btn-primary">Passer à la configuration des niveaux →</button>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
</body>
</html>
