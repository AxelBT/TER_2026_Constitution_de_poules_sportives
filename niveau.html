<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion du Niveau - Poules Sportives</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        /* Ajustements spécifiques pour le layout Dashboard */
        body { align-items: flex-start; background: #f0f2f5; padding: 20px; }
        .dashboard-container {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 20px;
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
        }
        #map { 
            height: 400px; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            z-index: 1;
        }
        .results-area {
            background: white;
            padding: 20px;
            border-radius: 12px;
            min-height: 500px;
        }
        .pool-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .pool-card {
            border: 1px solid #e5e7eb;
            padding: 15px;
            border-radius: 8px;
            background: #f9fafb;
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    
    <aside class="controls">
        <div class="card">
            <h2 id="titre-niveau">Niveau 1</h2>
            <p class="text-muted">Paramétrez les poules pour ce niveau.</p>
            <hr>
            
            <form id="form-niveau">
                <div class="form-group">
                    <label>Fichier CSV des équipes</label>
                    <input type="file" id="file_csv_niveau" accept=".csv" required>
                </div>

                <div class="form-group">
                    <label>Nombre de poules</label>
                    <input type="number" id="nb_poules" min="1" value="4" required>
                </div>

                <div class="form-group">
                    <label>Max équipes par poule</label>
                    <input type="number" id="nb_max_equipes" min="1" value="6" required>
                </div>

                <button type="button" id="btn-generer" class="btn-primary" style="background: #059669;">
                    🚀 Générer les poules
                </button>
            </form>

            <div class="stats-box" style="margin-top:20px;">
                <h4>Statistiques</h4>
                <div id="stats-content">Aucune donnée</div>
            </div>

            <div class="footer-nav" style="display: flex; justify-content: space-between; margin-top: 20px;">
                <button type="button" id="btn-prev" class="btn-primary" style="background: #6b7280; width: auto; padding: 10px 20px;">
                    ← Niveau Précédent
                </button>

                <button type="button" id="btn-next" class="btn-primary" style="background: #2563eb; width: auto; padding: 10px 20px;">
                    Niveau Suivant →
                </button>
            </div>
        </div>
    </aside>

    <main class="display-area">
        <div id="map"></div>

        <section class="results-area">
            <h3>Visualisation des Poules</h3>
            <div id="pool-results" class="pool-grid">
                <p class="text-muted">Les poules s'afficheront ici après génération.</p>
            </div>
        </section>
    </main>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="niveau.js"></script>
</body>
</html>
