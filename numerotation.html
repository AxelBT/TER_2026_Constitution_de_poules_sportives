<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendrier des rencontres</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="numerotation.css">
</head>
<body>

<!-- TOAST -->
<div class="toast-container" id="toast-container"></div>

<!-- Modale erreur -->
<div class="modal-overlay" id="modal-erreur" style="display:none">
    <div class="modal">
        <div class="modal-icon modal-icon--error">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
            </svg>
        </div>
        <h3 class="modal-title" id="modal-erreur-titre">Erreur</h3>
        <p class="modal-message" id="modal-erreur-message"></p>
        <div class="modal-actions">
            <button class="modal-btn modal-btn--confirm-error" id="modal-erreur-btn">J'ai compris</button>
        </div>
    </div>
</div>

<!-- TOPBAR -->
<!-- <header class="topbar">
    <div class="topbar-inner">
        
        <span class="topbar-page">Calendrier des rencontres</span>
    </div>
</header> -->

<!-- DASHBOARD -->
<div class="dashboard">

    <!-- SIDEBAR -->
    <aside class="sidebar">

        <!-- Fichier poules -->
        <div class="panel">
            <div class="panel-header">
                <span class="panel-title">Fichiers d'entrée</span>
            </div>
            <div class="panel-body">

                <!-- Drop zone poules -->
                <div class="field-group">
                    <label class="field-label">
                        Poules générées
                        <span class="field-hint">(CSV exporté depuis l'étape 1)</span>
                    </label>
                    <div class="drop-zone-sm" id="drop-zone-poules">
                        <input type="file" id="file-poules" accept=".csv">
                        <div class="drop-zone-sm-content">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <path d="M12 18v-6"/><path d="m9 15 3-3 3 3"/>
                            </svg>
                            <p id="label-poules">Glissez ou <strong>parcourez</strong></p>
                        </div>
                    </div>
                </div>

                <!-- Drop zone souhaits -->
                <div class="field-group">
                    <label class="field-label">
                        Souhaits des clubs
                        <span class="field-hint">(CSV : club, souhait)</span>
                    </label>
                    <div class="drop-zone-sm" id="drop-zone-souhaits">
                        <input type="file" id="file-souhaits" accept=".csv">
                        <div class="drop-zone-sm-content">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                                <polyline points="14 2 14 8 20 8"/>
                                <path d="M12 18v-6"/><path d="m9 15 3-3 3 3"/>
                            </svg>
                            <p id="label-souhaits">Glissez ou <strong>parcourez</strong></p>
                        </div>
                    </div>
                </div>

                <!-- Bouton générer -->
                <button class="btn-generate" id="btn-generer">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                    </svg>
                    Générer le calendrier
                </button>

            </div>
        </div>

        <!-- Export -->
        <div class="panel" id="panel-export" style="display:none">
            <div class="panel-header">
                <span class="panel-title">Exporter</span>
            </div>
            <div class="panel-body">
                <button class="btn-generate" id="btn-export-excel">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    Exporter en Excel
                </button>
                <button class="btn-generate btn-generate--alt" id="btn-export-csv">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"/>
                        <polyline points="14 2 14 8 20 8"/>
                        <line x1="8" y1="13" x2="16" y2="13"/>
                        <line x1="8" y1="17" x2="16" y2="17"/>
                    </svg>
                    Exporter en CSV
                </button>
            </div>
        </div>

        <!-- Navigation -->
        <div class="nav-row">
            <button class="btn-nav-prev" id="btn-prev">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                Retour 
            </button>
        </div>

    </aside>

    <!-- MAIN -->
    <main class="main-area">

        <!-- Onglets niveaux -->
        <div class="tabs-bar" id="tabs-bar"></div>

        <!-- Contenu -->
        <div id="calendrier-content">
            <div class="content-empty">
                <div class="content-empty-icon">
                    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="4" width="18" height="18" rx="2"/>
                        <line x1="16" y1="2" x2="16" y2="6"/>
                        <line x1="8" y1="2" x2="8" y2="6"/>
                        <line x1="3" y1="10" x2="21" y2="10"/>
                        <line x1="8" y1="14" x2="8.01" y2="14"/>
                        <line x1="12" y1="14" x2="12.01" y2="14"/>
                        <line x1="16" y1="14" x2="16.01" y2="14"/>
                    </svg>
                </div>
                <p>Importez les fichiers et cliquez sur <strong>Générer le calendrier</strong><br>pour visualiser les rencontres.</p>
            </div>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script type="module" src="numerotation.js" defer ></script>
</body>
</html>
